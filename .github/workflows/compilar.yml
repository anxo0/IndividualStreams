name: Compilar
on:
    push:
        branches:
            - main
        paths:
            - individualStreams/**
            - instalar.bat
            - .github/workflows/compilar.yml
    workflow_dispatch:

permissions:
    contents: write

jobs:
    compilar:
        runs-on: ubuntu-latest

        steps:
            - name: Descargar el plugin
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - name: Descargar Vencord
              run: git clone --depth 1 https://github.com/Vendicated/Vencord.git vencord

            - name: Preparar pnpm
              uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
              with:
                  package_json_file: vencord/package.json

            - name: Preparar Node.js
              uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version: 24
                  cache: pnpm
                  cache-dependency-path: vencord/pnpm-lock.yaml

            - name: Calcular la version
              run: |
                  PLUGIN_HASH=$(git rev-parse --short=7 HEAD)
                  VENCORD_COMMIT=$(git -C vencord rev-parse --short=7 HEAD)
                  echo "PLUGIN_HASH=$PLUGIN_HASH" >> "$GITHUB_ENV"
                  echo "TAG=v-$PLUGIN_HASH-$VENCORD_COMMIT" >> "$GITHUB_ENV"

            - name: Comprobar si ya existe
              id: existe
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  if gh release view "$TAG" > /dev/null 2>&1; then
                      echo "si=true" >> "$GITHUB_OUTPUT"
                  fi

            - name: Compilar
              if: steps.existe.outputs.si != 'true'
              working-directory: vencord
              env:
                  # El actualizador de Vencord buscara las versiones nuevas en este repositorio
                  VENCORD_REMOTE: ${{ github.repository }}
                  VENCORD_HASH: ${{ env.PLUGIN_HASH }}
              run: |
                  mkdir -p src/userplugins
                  cp -r ../individualStreams src/userplugins/
                  pnpm install --frozen-lockfile
                  pnpm build --standalone

            - name: Publicar la version
              if: steps.existe.outputs.si != 'true'
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  gh release create "$TAG" \
                      vencord/dist/patcher.js \
                      vencord/dist/preload.js \
                      vencord/dist/renderer.js \
                      vencord/dist/renderer.css \
                      instalar.bat \
                      --target "$GITHUB_SHA" \
                      --title "IndividualStreams $PLUGIN_HASH" \
                      --notes "Para instalarlo o actualizarlo, descarga instalar.bat y haz doble clic." \
                      --latest
